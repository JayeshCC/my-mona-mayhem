name: Build workshop and deploy configured Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import os, urllib.request, urllib.error
          request = urllib.request.Request(
              'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages',
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  enabled = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
              print('::notice::Pages is not configured; build passed and publication is skipped.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled='+str(enabled).lower()+'\n')
          PYTHON

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare workshop documentation
        run: |
          mkdir -p ./_site
          cp -r docs/* ./_site/
          mkdir -p ./_site/workshop/pt_BR ./_site/workshop/es
          cp -r workshop/pt_BR/* ./_site/workshop/pt_BR/
          cp -r workshop/es/* ./_site/workshop/es/
          touch ./_site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
